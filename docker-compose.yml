services:

  # ── Streamlit UI ──────────────────────────────────────────────────
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── LangGraph Studio API ──────────────────────────────────────────
  studio:
    build: .
    ports:
      - "8123:8123"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: >
      langgraph dev
      --host 0.0.0.0
      --port 8123
      --no-browser
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI — programmatic access ─────────────────────────────────
  # Start with: docker compose --profile api up
  # http://localhost:8000 | Swagger docs at http://localhost:8000/docs
  api:
    build: .
    profiles:
      - api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: