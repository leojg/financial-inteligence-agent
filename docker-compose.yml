services:

  # ── Streamlit UI ──────────────────────────────────────────────────
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── LangGraph Studio API ──────────────────────────────────────────
  studio:
    build: .
    ports:
      - "8123:8123"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: >
      langgraph dev
      --host 0.0.0.0
      --port 8123
      --no-browser
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI — programmatic access ─────────────────────────────────
  # Start with: docker compose --profile api up
  # http://localhost:8000 | Swagger docs at http://localhost:8000/docs
  api:
    build: .
    profiles:
      - api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── n8n — workflow automation ─────────────────────────────────────
  # Start with: docker compose --profile n8n up
  # http://localhost:5678
  n8n:
    image: docker.n8n.io/n8nio/n8n
    profiles:
      - n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_TELEGRAM_CHAT_ID=${N8N_TELEGRAM_CHAT_ID:-}
      - FINANCIAL_API_URL=${FINANCIAL_API_URL:-http://api:8000}
      - CREDENTIALS_OVERWRITE_DATA={"telegramApi":{"accessToken":"${N8N_TELEGRAM_BOT_TOKEN}"}}
      - CREDENTIALS_OVERWRITE_ENDPOINT=telegramApi
    env_file:
      - .env
    volumes:
      - n8n_data:/home/node/.n8n
      - ./src/integrations/n8n/workflows:/data/workflows:ro
      - ./src/integrations/n8n/entrypoint.sh:/docker-entrypoint-init.d/import.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-init.d/import.sh"]
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # ── ngrok tunnel (dev only) ────────────────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    profiles:
      - dev
    command: http n8n:5678 --domain=unlandmarked-irmgard-semiradically.ngrok-free.dev
    ports:
      - "4040:4040"    # ngrok inspection UI
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    depends_on:
      - n8n

volumes:
  pgdata:
  n8n_data: