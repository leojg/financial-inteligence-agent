[project]
name = "finance-intelligence-agent"
version = "0.2"
description = "An AI agent for personal finance intelligence built on LangGraph. Ingests bank statements from multiple accounts, normalizes and categorizes transactions, detects duplicates and suspicious activity, and produces structured reconciliation reports with human-in-the-loop review."
authors = [
    { name = "Leandro Garcia", email = "leojg2091@gmail.com" },
]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.4.0",
    "langchain-core>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=3.0.0",
    "tabulate>=0.9.0",
    "streamlit>=1.28.0",
    "fastapi[standard]>=0.100.0",
    "uvicorn>=0.20.0",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src", "langgraph.templates.agent" = "src/agents/reconciliator"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
markers = [
    "eval: LLM evaluation tests (require real API keys, slow — run with make eval)",
]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["D"]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "langchain_community.*",
    "langchain_anthropic",
    "langchain_openai",
    "streamlit",
    "langgraph.checkpoint.sqlite",
    "langgraph.checkpoint.postgres",
    "alembic",
    "alembic.*",
    "psycopg",
    "psycopg.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "codespell>=2.3.0",
    "langgraph-cli[inmem]>=0.4.12",
    "mypy>=1.13.0",
    "pandas-stubs>=2.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.2",
    "types-requests>=2.32.0",
]
